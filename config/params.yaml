# Parameters for data transformation
data_transformation:
  tokenizer:
    pretrained_model_name: google/pegasus-cnn_dailymail
    max_input_length: 1024
    max_target_length: 128

# Model training arguments
model_trainer:
  training_arguments:
    num_train_epochs: 3
    warmup_steps: 500
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 2
    weight_decay: 0.01
    logging_steps: 10
    eval_strategy: steps
    eval_steps: 500
    save_steps: 5000
    gradient_accumulation_steps: 8
    learning_rate: 3e-5
    fp16: true

# MLflow tracking settings
tracking:
  mlflow:
    enabled: true
    experiment_name: TextSummarizationExperiment
    registry_model_name: PegasusSummarizerModel
    metrics_to_log:
      - rouge1
      - rouge2
      - rougeL
      - rougeLsum
    log_trials: false

# Model evaluation metrics
model_evaluation:
  metrics:
    - rouge
  batch_size: 8
  subset_size: 10
  metric_options:
    rouge:
      use_stemmer: true
    bleu:
      max_order: 4
    meteor:
      alpha: 0.9
  column_text: dialogue
  column_summary: summary

prediction:
  num_beams: 4
  length_penalty: 1.0
  no_repeat_ngram_size: 0
  batch_size: 8
  early_stopping: true
  device: cuda