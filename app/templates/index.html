<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarization App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .container { max-width: 800px; }
        .card { margin-bottom: 20px; }
        textarea { min-height: 200px; }
        .result { margin-top: 15px; padding: 15px; background-color: #f8f9fa; border-radius: 5px; }
        .loading { display: none; }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="mb-4">Text Summarization App</h1>
        
        <!-- Training Section -->
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h2>Training Pipeline</h2>
            </div>
            <div class="card-body">
                <p>Click the button below to start training the text summarization model:</p>
                <button id="trainBtn" class="btn btn-primary">Start Training</button>
                <div id="trainingStatus" class="result"></div>
                <div id="trainingLoader" class="loading spinner-border text-primary" role="status"></div>
            </div>
        </div>
        
        <!-- Prediction Section -->
        <div class="card">
            <div class="card-header bg-success text-white">
                <h2>Prediction Pipeline</h2>
            </div>
            <div class="card-body">
                <form id="predictForm">
                    <div class="mb-3">
                        <label for="inputText" class="form-label">Enter text to summarize:</label>
                        <textarea class="form-control" id="inputText" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Generate Summary</button>
                </form>
                <div id="predictionResult" class="result"></div>
                <div id="predictionLoader" class="loading spinner-border text-success" role="status"></div>
            </div>
        </div>
    </div>

    <script>
        // Training functionality
        document.getElementById('trainBtn').addEventListener('click', async () => {
            const statusEl = document.getElementById('trainingStatus');
            const loader = document.getElementById('trainingLoader');
            
            statusEl.textContent = '';
            loader.style.display = 'inline-block';
            
            try {
                const response = await fetch('/train', { method: 'POST' });
                const result = await response.json();
                
                if (result.status === 'success') {
                    statusEl.innerHTML = `<div class="alert alert-success">${result.message}</div>`;
                } else {
                    statusEl.innerHTML = `<div class="alert alert-danger">Error: ${result.message}</div>`;
                }
            } catch (error) {
                statusEl.innerHTML = `<div class="alert alert-danger">Network error: ${error.message}</div>`;
            } finally {
                loader.style.display = 'none';
            }
        });
        
        // Prediction functionality
        document.getElementById('predictForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const inputText = document.getElementById('inputText').value;
            const resultEl = document.getElementById('predictionResult');
            const loader = document.getElementById('predictionLoader');
            
            // Clear previous results and errors
            resultEl.textContent = '';
            
            // Validate input
            if (!inputText.trim()) {
                resultEl.innerHTML = `<div class="alert alert-danger">Error: Input text cannot be empty</div>`;
                return;
            }
            
            // Show loader
            loader.style.display = 'inline-block';
            
            try {
                const formData = new FormData();
                formData.append('text', inputText);
                
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    resultEl.innerHTML = `
                        <h4>Summary:</h4>
                        <p>${result.summary}</p>
                    `;
                } else {
                    resultEl.innerHTML = `<div class="alert alert-danger">Error: ${result.message}</div>`;
                }
            } catch (error) {
                resultEl.innerHTML = `<div class="alert alert-danger">Network error: ${error.message}</div>`;
            } finally {
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
